name: Deploy DASNET to Vercel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dasnet-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Verify Vercel token identity
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel whoami --token="$VERCEL_TOKEN"

      - name: Run application checks
        run: |
          npm run typecheck
          npm run build

      - name: Attach wildcard merchant domain
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_FUjJJLDSAITzmg32U4dQzNw
          VERCEL_PROJECT_ID: prj_vZuYn5UoOgZbJ9NGLvyiTAFHfWPe
        run: |
          response=$(curl -sS -w '\\n%{http_code}' -X POST "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID" -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" --data '{"name":"*.dasmarket.co.ke"}')
          status=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')
          if [ "$status" = "200" ] || [ "$status" = "201" ]; then
            echo "Wildcard merchant domain attached to the DASNET project."
          elif printf '%s' "$body" | grep -Eqi 'already exists|already assigned|domain is already'; then
            echo "Wildcard merchant domain is already attached."
          else
            echo "::warning::Could not attach wildcard merchant domain (HTTP $status): $body. Continuing with application deployment."
          fi

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_FUjJJLDSAITzmg32U4dQzNw
          VERCEL_PROJECT_ID: prj_vZuYn5UoOgZbJ9NGLvyiTAFHfWPe
        run: npx vercel deploy --prod --yes --scope=cheruiyott233-4429s-projects --token="$VERCEL_TOKEN"
