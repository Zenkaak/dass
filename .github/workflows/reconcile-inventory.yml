name: Reconcile expired DASNET inventory reservations
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dasnet-inventory-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Obtain GitHub Actions OIDC token
        id: oidc
        shell: bash
        run: |
          token=$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dasnet-inventory-reconciliation" | jq -r '.value')
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::Could not obtain the GitHub Actions OIDC token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Reconcile expired stock reservations
        env:
          INVENTORY_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl --fail --silent --show-error --max-time 45 \
            --retry 2 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $INVENTORY_OIDC_TOKEN" \
            --header 'Content-Type: application/json' \
            'https://dasmarket.co.ke/api/store?action=reconcile-payments'
