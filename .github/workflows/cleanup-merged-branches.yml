name: Clean up merged PR branches

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-merged-branches.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List eligible branches without deleting them"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: merged-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches whose pull requests were merged
        env:
          GH_TOKEN: ${{ secrets.GH_BRANCH_CLEANUP_TOKEN }}
          REPO: Zenkaak/dass
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::GH_BRANCH_CLEANUP_TOKEN is missing."
            exit 1
          fi

          # Explicitly reviewed as redundant against current main; never add a branch
          # here without inspecting its complete diff and confirming its work is present.
          reviewed_redundant_branches=(
            "backup/main-before-branch-cleanup-2026-11-12"
            "bingw-style-seller-dashboard"
            "fix/payout-readiness-status"
            "improve-order-chat-payment-and-admin-details"
          )

          mapfile -t merged_branches < <(
            gh api --paginate --jq '.[] | select(.merged_at != null and .head.repo.full_name == "Zenkaak/dass") | .head.ref' \
              "repos/${REPO}/pulls?state=closed&per_page=100"
          )
          mapfile -t branches < <(printf '%s\n' "${merged_branches[@]}" "${reviewed_redundant_branches[@]}" | sed '/^$/d' | sort -u)

          mapfile -t open_branches < <(
            gh api --paginate --jq '.[] | select(.head.repo.full_name == "Zenkaak/dass") | .head.ref' \
              "repos/${REPO}/pulls?state=open&per_page=100" | sort -u
          )

          declare -A open_branch_set=()
          for open_branch in "${open_branches[@]}"; do
            open_branch_set["$open_branch"]=1
          done

          deleted=0
          skipped=0
          {
            echo "## Merged branch cleanup"
            echo
            echo "- Repository: ${REPO}"
            echo "- Dry run: ${DRY_RUN}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for branch in "${branches[@]}"; do
            if [[ -z "$branch" || "$branch" == "main" ]]; then
              ((skipped+=1))
              continue
            fi

            # Delete only same-repository heads attached to a merged pull request.
            if [[ -n "${open_branch_set[$branch]:-}" ]]; then
              echo "Skipped branch with an open pull request: $branch"
              echo "- Skipped (open PR): `$branch`" >> "$GITHUB_STEP_SUMMARY"
              ((skipped+=1))
              continue
            fi

            ref="heads/$branch"
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "Would delete: $branch"
              echo "- Would delete: `$branch`" >> "$GITHUB_STEP_SUMMARY"
            else
              if gh api "repos/${REPO}/git/refs/${ref}" >/dev/null 2>&1; then
                gh api --method DELETE "repos/${REPO}/git/refs/${ref}"
                echo "Deleted: $branch"
                echo "- Deleted: `$branch`" >> "$GITHUB_STEP_SUMMARY"
                ((deleted+=1))
              else
                echo "Skipped missing ref: $branch"
                echo "- Skipped (ref already absent): `$branch`" >> "$GITHUB_STEP_SUMMARY"
                ((skipped+=1))
              fi
            fi
          done

          {
            echo
            echo "- Deleted this run: ${deleted}"
            echo "- Skipped protected/empty refs: ${skipped}"
            echo "- Eligible merged-PR branches found: ${#branches[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
